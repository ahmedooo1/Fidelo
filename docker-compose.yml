version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fidelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fidelo}
      POSTGRES_DB: fidelo
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - fidelo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fidelo']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3021
      DATABASE_URL: postgres://fidelo:${POSTGRES_PASSWORD:-fidelo}@postgres:5432/fidelo
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3020}
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:-3021}:3021'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:3021/api}
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-3020}:3020'
    depends_on:
      - backend

volumes:
  fidelo_pgdata:
