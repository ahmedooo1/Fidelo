name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no"

          # Fidelo is Docker Compose (postgres + backend + frontend). Images
          # are built directly on the VPS -- the .env with JWT/DB/SMTP
          # secrets already lives there and never touches this workflow.
          $SSH "$REMOTE_USER@$HOST" "cd $DEST && git fetch origin main && git reset --hard origin/main && sudo docker compose up -d --build"

          rm -f ~/.ssh/deploy_key
